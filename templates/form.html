<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Valuation Form</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for a dark, professional, and crystalline look */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a; /* Deep Black */
            color: #FFFFFF;
        }
        /* Define a sparkling white/silver accent color */
        .text-accent { color: #BAE6FD; } /* Light Sky Blue for brilliance */
        .form-label {
            color: #BAE6FD; 
            font-weight: 600;
        }
        
        /* FIX: Change input background to a darker solid color to prevent white input box issue */
        .input-field, .select-field {
            background-color: #1f2937; /* Dark Gray for guaranteed dark background */
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            transition: all 0.2s;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        
        /* FIX: Ensure input styles persist on browser autofill (webkit browsers) */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #1f2937 inset !important;
            -webkit-text-fill-color: #FFFFFF !important;
            border-color: #BAE6FD !important;
        }

        .input-field:focus, .select-field:focus {
            outline: none;
            border-color: #BAE6FD; /* Blue border on focus */
            box-shadow: 0 0 0 1px #BAE6FD;
        }
        .submit-btn { 
            background: linear-gradient(45deg, #BAE6FD, #60A5FA); /* Blue/Silver Gradient */
            color: #0a0a0a;
            box-shadow: 0 4px 15px rgba(186, 230, 253, 0.6);
        }
        .submit-btn:hover {
            background: linear-gradient(45deg, #E0F2FE, #93C5FD);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(186, 230, 253, 0.8);
        }
        /* Card background with high transparency and blur for "diamond" look */
        .card-bg {
            background-color: rgba(255, 255, 255, 0.05); /* Very low opacity white */
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Removed diamond-header styles */

        /* FIX: Dropdown Options Readability */
        .select-field option {
            background-color: #1f2937; /* Dark background for options */
            color: #FFFFFF; /* White text for readability */
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">
    
    <!-- Removed Top Diamond Header Strip -->

    <!-- Header -->
    <div class="w-full max-w-4xl text-center mt-4 mb-10">
        <h1 class="text-5xl font-extrabold text-white">4C Specification</h1>
    </div>

    <!-- Prediction Form Card -->
    <form action="{{url_for('predict_datapoint')}}" method="POST" 
          class="w-full max-w-3xl card-bg p-8 md:p-12 rounded-xl shadow-2xl relative">
        
        <!-- Grid for ALL Features -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-6">
            
            <!-- 1. Carat -->
            <div class="form-group">
                <label for="carat" class="form-label block mb-2 text-sm uppercase">Carat (Weight)</label>
                <input type="text" id="carat" name="carat" placeholder="Weight in Carats (e.g., 0.50)" 
                       class="input-field w-full p-3 rounded-lg focus:outline-none" required>
            </div>
        
            <!-- 2. Cut -->
            <div class="form-group">
                <label for="cut" class="form-label block mb-2 text-sm uppercase">Cut</label>
                <!-- Added select-field class for styling -->
                <select id="cut" name="cut" class="select-field w-full p-3 rounded-lg focus:outline-none">
                    <option value="Ideal">Ideal</option>
                    <option value="Premium">Premium</option>
                    <option value="Very Good">Very Good</option>
                    <option value="Good">Good</option>
                    <option value="Fair">Fair</option>
                </select>
            </div>
          
            <!-- 3. Color -->
            <div class="form-group">
                <label for="color" class="form-label block mb-2 text-sm uppercase">Color</label>
                <!-- Added select-field class for styling -->
                <select id="color" name="color" class="select-field w-full p-3 rounded-lg focus:outline-none">
                    <option value="D">D (Colorless)</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="G">G</option>
                    <option value="H">H</option>
                    <option value="I">I</option>
                    <option value="J">J (Tinted)</option>
                </select>
            </div>

            <!-- 4. Clarity -->
            <div class="form-group">
                <label for="clarity" class="form-label block mb-2 text-sm uppercase">Clarity</label>
                <!-- Added select-field class for styling -->
                <select id="clarity" name="clarity" class="select-field w-full p-3 rounded-lg focus:outline-none">
                    <option value="IF">IF (Flawless)</option>
                    <option value="VVS1">VVS1</option>
                    <option value="VVS2">VVS2</option>
                    <option value="VS1">VS1</option>
                    <option value="VS2">VS2</option>
                    <option value="SI1">SI1</option>
                    <option value="SI2">SI2</option>
                    <option value="I1">I1 (Included)</option>
                </select>
            </div>
            
            <!-- 5. Depth % -->
            <div class="form-group">
                <label for="depth" class="form-label block mb-2 text-sm uppercase">Depth %</label>
                <input type="text" id="depth" name="depth" placeholder="Depth Percentage (e.g., 61.8)" 
                       class="input-field w-full p-3 rounded-lg focus:outline-none" required>
            </div>
        
            <!-- 6. Table % -->
            <div class="form-group">  
                <label for="table" class="form-label block mb-2 text-sm uppercase">Table %</label>
                <input type="text" id="table" name="table" placeholder="Table Percentage (e.g., 57.0)" 
                       class="input-field w-full p-3 rounded-lg focus:outline-none" required>
            </div>

            <!-- 7. Length (x) -->
            <div class="form-group">
                <label for="x" class="form-label block mb-2 text-sm uppercase">Length (x) mm</label>
                <input type="text" id="x" name="x" placeholder="Length in mm (e.g., 5.10)" 
                       class="input-field w-full p-3 rounded-lg focus:outline-none" required>
            </div>
          
            <!-- 8. Width (y) -->
            <div class="form-group">
                <label for="y" class="form-label block mb-2 text-sm uppercase">Width (y) mm</label>
                <input type="text" id="y" name="y" placeholder="Width in mm (e.g., 5.13)" 
                       class="input-field w-full p-3 rounded-lg focus:outline-none" required>
            </div>
          
            <!-- 9. Height (z) -->
            <div class="form-group">
                <label for="z" class="form-label block mb-2 text-sm uppercase">Height (z) mm</label>
                <input type="text" id="z" name="z" placeholder="Height in mm (e.g., 3.16)" 
                       class="input-field w-full p-3 rounded-lg focus:outline-none" required>
            </div>

        </div>

        <!-- Submit Button -->
        <div class="text-center mt-10">
            <input type="submit" value="ESTIMATE VALUE NOW" 
                   class="submit-btn font-extrabold py-3 px-10 rounded-full cursor-pointer 
                          transition duration-300 ease-in-out">
        </div>
    </form>

    <!-- Result Display - Crystalline Look -->
    {% if final_result %}
    <div class="w-full max-w-3xl mt-12 p-8 rounded-xl border-t-2 border-accent text-center 
                bg-gray-900/50 shadow-lg shadow-sky-500/20 card-bg">
        <p class="text-xl font-light tracking-widest text-gray-400 mb-2 uppercase">
            Estimated Retail Value
        </p>
        <p class="text-7xl font-extrabold text-accent">
            <span class="text-5xl align-top mr-1 text-white">$</span>{{ final_result }} 
        </p>
        <p class="text-xs text-gray-500 mt-4">
            Price based on machine learning model.
        </p>
    </div>
    {% endif %}

    <!-- Back to Home Button -->
    <div class="mt-8">
        <a href="/" class="text-gray-400 hover:text-accent text-sm transition duration-300 tracking-wider">
            &larr; Return to Dashboard
        </a>
    </div>

    <!-- Project Credit Added -->
    <div class="mt-4 mb-4">
        <p class="text-xs text-gray-600 tracking-wider">
            Project by: Atharv Prashant Tungatkar
        </p>
    </div>
</body>
